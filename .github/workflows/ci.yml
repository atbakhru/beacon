name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: beacon
          POSTGRES_DB: beacon
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U beacon" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - run: go vet ./...
      - run: go test -race -count=1 -v ./...
        env:
          TEST_DATABASE_URL: postgres://beacon:beacon@localhost:5432/beacon?sslmode=disable
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: apps/web/test-results
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker/compose.yml up -d --build
      - name: Wait for API
        run: for i in $(seq 1 90); do curl -fsS http://localhost:8080/healthz && exit 0; sleep 2; done; exit 1
      - run: python3 scripts/seed.py
      - run: python3 scripts/smoke.py
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - run: go test -v ./internal/beacon -run TestLiveWebSocketResync
        env:
          BEACON_TEST_URL: http://localhost:8080
      - name: Container logs
        if: failure()
        run: docker compose -f infra/docker/compose.yml logs --tail=100
      - name: Stop stack
        if: always()
        run: docker compose -f infra/docker/compose.yml down -v
